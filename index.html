<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFM — nana Follow Manager</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#202638;--muted:#6b7280;--line:#e2e6ef;--accent:#6558d3;--accent2:#eeeaff;--danger:#c83b54}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#24233a;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header small{color:#c9c7e6}.wrap{max-width:1250px;margin:20px auto;padding:0 16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab,button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink);cursor:pointer;font:inherit}.tab.active,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.5;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:16px;box-shadow:0 3px 14px #26304a08}
h2{font-size:17px;margin:0 0 13px}h3{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d8dce7;border-radius:8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:70px;resize:vertical}.checks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px}.checks input{width:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f6f5ff;border-radius:10px;padding:10px 13px;min-width:120px}.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar>div{min-width:170px;flex:1}.toolbar button{flex:0 0 auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);white-space:nowrap}td .sub{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:2px 7px;background:#f0effb;border-radius:20px;font-size:11px;margin:2px}.fav{color:#d99b00}.pin{color:var(--accent)}.scroll{overflow:auto}
.usercards{display:none}.usercard{border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0}.usercard strong{font-size:15px}.usercard .cardmeta{color:var(--muted);font-size:12px;margin:5px 0}
small.muted,.muted{color:var(--muted)}.hidden{display:none!important}.inline{display:inline-flex;gap:7px;align-items:center}.empty{text-align:center;color:var(--muted);padding:24px}
dialog{border:0;border-radius:14px;padding:20px;max-width:600px;width:calc(100% - 24px);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#11182777}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.memo-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:7px 0}
.memo-tools>div{flex:1;min-width:180px}
.link-id{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;font-weight:600}
.draggable-id{cursor:grab;user-select:none}.relation-note{font-size:12px;color:var(--muted);margin:5px 0 9px}
.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:7px 12px}.detail-grid .key{color:var(--muted);font-size:12px}

@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scroll table{min-width:760px}.usercards{display:block}.desktopusers{display:none}}
@media(max-width:480px){.grid,.grid.two{grid-template-columns:1fr}.wrap{padding:0 10px}.panel{padding:13px}}
</style>
</head>
<body>
<header><div><h1>NFM <small>nana Follow Manager</small></h1><small>フォロー・投稿・リアクションをまとめて管理</small></div><div class="inline"><button id="exportBtn">JSON保存</button><button id="csvBtn">CSV保存</button><label style="margin:0"><button onclick="document.getElementById('importFile').click()">読込</button><input id="importFile" type="file" accept=".json,.csv" hidden></label></div></header>
<div class="wrap">
<nav><button class="tab active" data-tab="users">ユーザー</button><button class="tab" data-tab="posts">投稿</button><button class="tab" data-tab="reactions">リアクション記録</button><button class="tab" data-tab="analysis">分析</button></nav>
<section id="users" class="view">
<div class="panel"><h2>ユーザー登録・編集</h2><form id="userForm">
<input type="hidden" id="editId">
<div class="grid">
<div><label>Nana ID（数値）</label><input id="nanaId" type="text" inputmode="numeric" placeholder="例：123456" required></div>
<div><label>表示名</label><input id="displayName" placeholder="ユーザー名" required></div>
<div><label>フォロー状態</label><div class="checks"><label><input type="checkbox" id="isFollowing">自分がフォロー</label><label><input type="checkbox" id="isFollower">相手がフォロー</label></div></div>
<div><label>その他確認</label><div class="checks"><label><input type="checkbox" id="otherCheck">要確認</label><label><input type="checkbox" id="favorite">★お気に入り</label><label><input type="checkbox" id="pinned">📌ピン留め</label></div></div>
</div><div style="margin-top:10px"><label>メモ（NFM IDをリンクできます）</label>
<div class="memo-tools"><div><label>関連ユーザーを選択</label><select id="memoLinkUser"><option value="">ユーザーを選択…</option></select></div><button type="button" id="insertMemoLink">@IDを挿入</button></div>
<div class="relation-note">選択して挿入、またはユーザー一覧のNFM IDをPCでドラッグ＆ドロップ。メモ内の @NFM-xxxx はクリックして詳細を開けます。</div>
<textarea id="userMemo" placeholder="例：@NFM-0005 とつながりあり。&#10;@NFM-0012 の転生アカと思われる。"></textarea></div>
<div class="actions"><button class="primary" type="submit">登録 / 更新</button><button type="button" id="cancelEdit">入力クリア</button></div></form></div>
<div class="panel"><div class="stats" id="userStats"></div></div>
<div class="panel"><h2>ユーザー一覧</h2><div class="toolbar">
<div><label>検索</label><input id="userSearch" placeholder="表示名・Nana ID・NFM ID・メモ"></div>
<div><label>表示対象</label><select id="userFilter"><option value="all">すべて</option><option value="following">自分がフォロー</option><option value="follower">相手がフォロー</option><option value="mutual">相互フォロー</option><option value="other">要確認</option><option value="favorite">お気に入り</option></select></div>
<div><label>並び順</label><select id="userSort"><option value="new">登録順（新しい）</option><option value="old">登録順（古い）</option><option value="nanaAsc">Nana ID 昇順（古い順）</option><option value="nanaDesc">Nana ID 降順（新しい順）</option><option value="name">表示名</option></select></div>
<button id="clearSearch">検索解除</button></div>
<div class="scroll desktopusers"><table><thead><tr><th>NFM ID</th><th>Nana ID</th><th>表示名 / メモ</th><th>関係</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div><div class="usercards" id="userCards"></div><div id="userEmpty" class="empty hidden">ユーザーがいません。</div></div>
</section>
<section id="posts" class="view hidden">
<div class="panel"><h2>投稿登録・編集</h2><form id="postForm"><input id="postEditId" type="hidden"><div class="grid">
<div><label>投稿日</label><input id="postDate" type="date" required></div><div><label>曲名</label><input id="songTitle" placeholder="曲名" required></div><div><label>アーティスト</label><input id="artist" placeholder="アーティスト"></div><div><label>タグ（カンマ区切り）</label><input id="postTags" placeholder="ネタ, コラボ, ケロケロ"></div>
</div><div style="margin-top:10px"><label>メモ / URL</label><textarea id="postMemo"></textarea></div><div class="actions"><button class="primary" type="submit">投稿を登録 / 更新</button><button type="button" id="clearPost">入力クリア</button></div></form></div>
<div class="panel"><h2>投稿一覧</h2><div class="toolbar"><div><label>検索</label><input id="postSearch" placeholder="曲名・アーティスト・タグ"></div><div><label>並び順</label><select id="postSort"><option value="new">投稿日（新しい）</option><option value="old">投稿日（古い）</option></select></div></div><div id="postList"></div></div>
</section>
<section id="reactions" class="view hidden">
<div class="panel"><h2>リアクションを記録</h2><form id="reactionForm"><div class="grid">
<div><label>対象投稿</label><select id="reactionPost" required></select></div><div><label>相手ユーザー</label><select id="reactionUser" required></select></div><div><label>記録日</label><input id="reactionDate" type="date" required></div><div><label>リアクション</label><select id="reactionType"><option>拍手</option><option>クラップバースト</option><option>コメント</option><option>ギフト</option><option>プレリス追加</option></select></div>
</div><div style="margin-top:10px"><label>内容（コメント本文など）</label><textarea id="reactionMemo"></textarea></div><div class="actions"><button class="primary" type="submit">記録する</button></div></form></div>
<div class="panel"><h2>記録一覧</h2><div class="toolbar"><div><label>ユーザー</label><select id="reactionFilterUser"><option value="">すべて</option></select></div><div><label>投稿</label><select id="reactionFilterPost"><option value="">すべて</option></select></div></div><div id="reactionList"></div></div>
</section>
<section id="analysis" class="view hidden"><div class="panel"><h2>リアクション分析</h2><p class="muted">投稿ごとの反応数と、ユーザー別の反応傾向を確認できます。記録済みデータをもとに集計します。</p><div id="analysisContent"></div></div></section>
</div>
<dialog id="userDetailDialog"><div class="dialoghead"><h2 id="detailTitle">ユーザー詳細</h2><button type="button" onclick="closeUserDetail()">閉じる</button></div><div id="detailBody"></div><div class="actions"><button type="button" class="primary" id="detailEditBtn">編集する</button></div></dialog>
<script>
const KEY='nfm_data_v2';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
let data=load();
function fresh(){return {users:[],posts:[],reactions:[],nextUser:1,nextPost:1,nextReaction:1}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return Object.assign(fresh(),d||{})}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nfm(n){return 'NFM-'+String(n).padStart(4,'0')}
function resetUserForm(){ $('userForm').reset();$('editId').value='';}
function resetPostForm(){ $('postForm').reset();$('postEditId').value='';$('postDate').value=today()}
function dateLabel(d){return d||'—'}

function renderMemo(text){
 return esc(text).replace(/@?(NFM-\d{4,})/g,(match,id)=>{
  const user=data.users.find(x=>x.nfmId===id);
  if(!user)return match;
  return `<span class="link-id" role="button" tabindex="0" onclick="openUserDetail(${user.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openUserDetail(${user.id})}" title="${esc(user.name)}の詳細">${match.startsWith('@')?'@':''}${id}</span>`;
 });
}
function refreshMemoLinkOptions(){
 const select=$('memoLinkUser'),current=select.value;
 select.innerHTML='<option value="">ユーザーを選択…</option>'+data.users.slice().sort((a,b)=>a.id-b.id).map(u=>`<option value="${u.id}">${u.nfmId} — ${esc(u.name)}</option>`).join('');
 if(data.users.some(u=>String(u.id)===current))select.value=current;
}
$('insertMemoLink').onclick=()=>{
 const user=data.users.find(u=>u.id===Number($('memoLinkUser').value));
 if(!user){alert('関連ユーザーを選択してください');return}
 const t=$('userMemo'),start=t.selectionStart??t.value.length,end=t.selectionEnd??start;
 const before=t.value.slice(0,start),after=t.value.slice(end),token='@'+user.nfmId;
 const pre=before&&!/\s$/.test(before)?' ':'',post=after&&!/^\s/.test(after)?' ':'';
 t.value=before+pre+token+post+after;t.focus();
 const pos=(before+pre+token+post).length;t.setSelectionRange(pos,pos);
};
function dragNfmId(event,id){const u=data.users.find(x=>x.id===id);if(u){event.dataTransfer.setData('text/plain','@'+u.nfmId);event.dataTransfer.effectAllowed='copy'}}
$('userMemo').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
$('userMemo').addEventListener('drop',e=>{
 e.preventDefault();const token=e.dataTransfer.getData('text/plain');if(!/^@?NFM-\d{4,}$/.test(token))return;
 const t=e.currentTarget,start=t.selectionStart??t.value.length,end=t.selectionEnd??start,b=t.value.slice(0,start),a=t.value.slice(end);
 const value=token.startsWith('@')?token:'@'+token,pre=b&&!/\s$/.test(b)?' ':'',post=a&&!/^\s/.test(a)?' ':'';
 t.value=b+pre+value+post+a;t.focus();const pos=(b+pre+value+post).length;t.setSelectionRange(pos,pos);
});
function openUserDetail(id){
 const u=data.users.find(x=>x.id===id);if(!u)return;
 $('detailTitle').textContent=u.nfmId+' — '+u.name;
 const ids=[...String(u.memo||'').matchAll(/@?(NFM-\d{4,})/g)].map(m=>m[1]);
 const rel=[...new Set(ids)].map(n=>data.users.find(x=>x.nfmId===n)).filter(Boolean);
 $('detailBody').innerHTML=`<div class="detail-grid"><div class="key">Nana ID</div><div>${esc(u.nanaId)}</div><div class="key">フォロー状態</div><div>${u.following?'自分がフォロー ':''}${u.follower?'相手がフォロー ':''}${u.other?'要確認':''}</div><div class="key">メモ</div><div>${renderMemo(u.memo||'（メモなし）')}</div><div class="key">関連ユーザー</div><div>${rel.length?rel.map(v=>`<span class="link-id" onclick="openUserDetail(${v.id})">${v.nfmId} — ${esc(v.name)}</span>`).join('<br>'):'なし'}</div></div>`;
 $('detailEditBtn').onclick=()=>{closeUserDetail();editUser(id)};$('userDetailDialog').showModal();
}
function closeUserDetail(){$('userDetailDialog').close()}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
function renderMemo(text){
 return esc(text).replace(/@?(NFM-\d{4,})/g,(match,id)=>{
  const user=data.users.find(x=>x.nfmId===id);
  if(!user)return match;
  return `<span class="link-id" role="button" tabindex="0" onclick="openUserDetail(${user.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openUserDetail(${user.id})}" title="${esc(user.name)}の詳細">${match.startsWith('@')?'@':''}${id}</span>`;
 });
}
function refreshMemoLinkOptions(){
 const select=$('memoLinkUser'),current=select.value;
 select.innerHTML='<option value="">ユーザーを選択…</option>'+data.users.slice().sort((a,b)=>a.id-b.id).map(u=>`<option value="${u.id}">${u.nfmId} — ${esc(u.name)}</option>`).join('');
 if(data.users.some(u=>String(u.id)===current))select.value=current;
}
$('insertMemoLink').onclick=()=>{
 const user=data.users.find(u=>u.id===Number($('memoLinkUser').value));
 if(!user){alert('関連ユーザーを選択してください');return}
 const t=$('userMemo'),start=t.selectionStart??t.value.length,end=t.selectionEnd??start;
 const before=t.value.slice(0,start),after=t.value.slice(end),token='@'+user.nfmId;
 const pre=before&&!/\s$/.test(before)?' ':'',post=after&&!/^\s/.test(after)?' ':'';
 t.value=before+pre+token+post+after;t.focus();
 const pos=(before+pre+token+post).length;t.setSelectionRange(pos,pos);
};
function dragNfmId(event,id){const u=data.users.find(x=>x.id===id);if(u){event.dataTransfer.setData('text/plain','@'+u.nfmId);event.dataTransfer.effectAllowed='copy'}}
$('userMemo').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
$('userMemo').addEventListener('drop',e=>{
 e.preventDefault();const token=e.dataTransfer.getData('text/plain');if(!/^@?NFM-\d{4,}$/.test(token))return;
 const t=e.currentTarget,start=t.selectionStart??t.value.length,end=t.selectionEnd??start,b=t.value.slice(0,start),a=t.value.slice(end);
 const value=token.startsWith('@')?token:'@'+token,pre=b&&!/\s$/.test(b)?' ':'',post=a&&!/^\s/.test(a)?' ':'';
 t.value=b+pre+value+post+a;t.focus();const pos=(b+pre+value+post).length;t.setSelectionRange(pos,pos);
});
function openUserDetail(id){
 const u=data.users.find(x=>x.id===id);if(!u)return;
 $('detailTitle').textContent=u.nfmId+' — '+u.name;
 const ids=[...String(u.memo||'').matchAll(/@?(NFM-\d{4,})/g)].map(m=>m[1]);
 const rel=[...new Set(ids)].map(n=>data.users.find(x=>x.nfmId===n)).filter(Boolean);
 $('detailBody').innerHTML=`<div class="detail-grid"><div class="key">Nana ID</div><div>${esc(u.nanaId)}</div><div class="key">フォロー状態</div><div>${u.following?'自分がフォロー ':''}${u.follower?'相手がフォロー ':''}${u.other?'要確認':''}</div><div class="key">メモ</div><div>${renderMemo(u.memo||'（メモなし）')}</div><div class="key">関連ユーザー</div><div>${rel.length?rel.map(v=>`<span class="link-id" onclick="openUserDetail(${v.id})">${v.nfmId} — ${esc(v.name)}</span>`).join('<br>'):'なし'}</div></div>`;
 $('detailEditBtn').onclick=()=>{closeUserDetail();editUser(id)};$('userDetailDialog').showModal();
}
function closeUserDetail(){$('userDetailDialog').close()}

document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab));});
$('userForm').onsubmit=e=>{e.preventDefault();let id=$('editId').value, nana=$('nanaId').value.trim();if(!/^\d+$/.test(nana)){alert('Nana IDは数字で入力してください');return}
let duplicate=data.users.find(u=>u.nanaId===nana&&u.id!==Number(id));if(duplicate){alert('同じNana IDのユーザーが登録済みです');return}
let u={nanaId:nana,name:$('displayName').value.trim(),following:$('isFollowing').checked,follower:$('isFollower').checked,other:$('otherCheck').checked,favorite:$('favorite').checked,pinned:$('pinned').checked,memo:$('userMemo').value};
if(id){Object.assign(data.users.find(x=>x.id===Number(id)),u)}else{u.id=data.nextUser++;u.nfmId=nfm(u.id);u.createdAt=new Date().toISOString();data.users.push(u)}resetUserForm();save()};
$('cancelEdit').onclick=resetUserForm;
$('userSearch').oninput=renderUsers;$('userFilter').onchange=renderUsers;$('userSort').onchange=renderUsers;$('clearSearch').onclick=()=>{$('userSearch').value='';$('userFilter').value='all';renderUsers()};
function editUser(id){let u=data.users.find(x=>x.id===id);if(!u)return;$('editId').value=u.id;$('nanaId').value=u.nanaId;$('displayName').value=u.name;$('isFollowing').checked=u.following;$('isFollower').checked=u.follower;$('otherCheck').checked=u.other;$('favorite').checked=u.favorite;$('pinned').checked=u.pinned;$('userMemo').value=u.memo||'';window.scrollTo({top:0,behavior:'smooth'})}
function deleteUser(id){if(!confirm('ユーザーを削除しますか？関連するリアクション記録も削除されます。NFM番号は再利用されません。'))return;data.users=data.users.filter(u=>u.id!==id);data.reactions=data.reactions.filter(r=>r.userId!==id);save()}
function renderUsers(){let q=$('userSearch').value.toLowerCase(),f=$('userFilter').value,s=$('userSort').value;let a=data.users.filter(u=>(`${u.nfmId} ${u.nanaId} ${u.name} ${u.memo||''}`).toLowerCase().includes(q)).filter(u=>f==='all'||(f==='following'&&u.following)||(f==='follower'&&u.follower)||(f==='mutual'&&u.following&&u.follower)||(f==='other'&&u.other)||(f==='favorite'&&u.favorite));
a.sort((x,y)=>y.pinned-x.pinned||(s==='new'?y.id-x.id:s==='old'?x.id-y.id:s==='nanaAsc'?Number(x.nanaId)-Number(y.nanaId):s==='nanaDesc'?Number(y.nanaId)-Number(x.nanaId):x.name.localeCompare(y.name,'ja')));
$('userRows').innerHTML=a.map(u=>`<tr><td><span class="draggable-id" draggable="true" ondragstart="dragNfmId(event,${u.id})" onclick="openUserDetail(${u.id})" title="クリックで詳細 / PCではドラッグ">${u.nfmId}</span>${u.pinned?' <span class="pin">📌</span>':''}</td><td>${esc(u.nanaId)}</td><td><b>${esc(u.name)}</b>${u.favorite?' <span class="fav">★</span>':''}<div class="sub">${renderMemo(u.memo||'')}</div></td><td>${u.following?'<span class="badge">自分→相手</span>':''}${u.follower?'<span class="badge">相手→自分</span>':''}${u.other?'<span class="badge">要確認</span>':''}</td><td><button onclick="editUser(${u.id})">編集</button> <button class="danger" onclick="deleteUser(${u.id})">削除</button></td></tr>`).join('');
$('userCards').innerHTML=a.map(u=>`<div class="usercard"><strong>${esc(u.name)} ${u.favorite?'★':''} ${u.pinned?'📌':''}</strong><div class="cardmeta">${u.nfmId} / Nana ID: ${esc(u.nanaId)}</div><div>${u.following?'自分がフォロー ':''}${u.follower?'相手がフォロー ':''}${u.other?'要確認':''}</div><div class="sub">${renderMemo(u.memo||'')}</div><div class="actions"><button onclick="editUser(${u.id})">編集</button><button class="danger" onclick="deleteUser(${u.id})">削除</button></div></div>`).join('');
$('userEmpty').classList.toggle('hidden',a.length>0);$('userStats').innerHTML=[['登録数',data.users.length],['フォロー中',data.users.filter(u=>u.following).length],['フォロワー',data.users.filter(u=>u.follower).length],['相互',data.users.filter(u=>u.following&&u.follower).length]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
$('postForm').onsubmit=e=>{e.preventDefault();let id=Number($('postEditId').value);let p={date:$('postDate').value,title:$('songTitle').value.trim(),artist:$('artist').value.trim(),tags:$('postTags').value.split(',').map(x=>x.trim()).filter(Boolean),memo:$('postMemo').value};if(id)Object.assign(data.posts.find(x=>x.id===id),p);else{p.id=data.nextPost++;data.posts.push(p)}resetPostForm();save()};
$('clearPost').onclick=resetPostForm;
function editPost(id){let p=data.posts.find(x=>x.id===id);$('postEditId').value=p.id;$('postDate').value=p.date;$('songTitle').value=p.title;$('artist').value=p.artist;$('postTags').value=p.tags.join(', ');$('postMemo').value=p.memo||'';window.scrollTo({top:0,behavior:'smooth'})}
function deletePost(id){if(!confirm('投稿を削除しますか？関連リアクションも削除されます。'))return;data.posts=data.posts.filter(p=>p.id!==id);data.reactions=data.reactions.filter(r=>r.postId!==id);save()}
function renderPosts(){let q=$('postSearch').value.toLowerCase(),s=$('postSort').value;let a=data.posts.filter(p=>(p.title+' '+p.artist+' '+p.tags.join(' ')).toLowerCase().includes(q));a.sort((x,y)=>s==='new'?y.date.localeCompare(x.date):x.date.localeCompare(y.date));$('postList').innerHTML=a.length?a.map(p=>`<div class="usercard"><strong>${esc(p.title)}</strong> — ${esc(p.artist)}<div class="cardmeta">${dateLabel(p.date)} ${p.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><div>${esc(p.memo||'')}</div><div class="actions"><button onclick="editPost(${p.id})">編集</button><button class="danger" onclick="deletePost(${p.id})">削除</button></div></div>`).join():'<div class="empty">投稿がありません。</div>'}
$('postSearch').oninput=renderPosts;$('postSort').onchange=renderPosts;
$('reactionDate').value=today();
$('reactionForm').onsubmit=e=>{e.preventDefault();if(!data.posts.length||!data.users.length){alert('先にユーザーと投稿を登録してください');return}data.reactions.push({id:data.nextReaction++,postId:Number($('reactionPost').value),userId:Number($('reactionUser').value),date:$('reactionDate').value,type:$('reactionType').value,memo:$('reactionMemo').value});$('reactionMemo').value='';save()};
$('reactionFilterUser').onchange=renderReactions;$('reactionFilterPost').onchange=renderReactions;
function renderReactions(){let r=data.reactions.filter(x=>(!$('reactionFilterUser').value||x.userId===Number($('reactionFilterUser').value))&&(!$('reactionFilterPost').value||x.postId===Number($('reactionFilterPost').value))).sort((a,b)=>b.date.localeCompare(a.date));$('reactionList').innerHTML=r.length?r.map(x=>{let u=data.users.find(y=>y.id===x.userId),p=data.posts.find(y=>y.id===x.postId);return `<div class="usercard"><strong>${esc(u?.name||'削除済み')} × ${esc(p?.title||'削除済み')}</strong><div class="cardmeta">${esc(x.date)} · <span class="badge">${esc(x.type)}</span></div>${esc(x.memo||'')}<div class="actions"><button class="danger" onclick="deleteReaction(${x.id})">削除</button></div></div>`}).join():'<div class="empty">記録がありません。</div>'}
function deleteReaction(id){if(confirm('この記録を削除しますか？')){data.reactions=data.reactions.filter(x=>x.id!==id);save()}}
function fillSelects(){let users=data.users.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja')),posts=data.posts.slice().sort((a,b)=>b.date.localeCompare(a.date));$('reactionUser').innerHTML=users.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.nfmId})</option>`).join('');$('reactionPost').innerHTML=posts.map(p=>`<option value="${p.id}">${esc(p.date)} ${esc(p.title)}</option>`).join('');$('reactionFilterUser').innerHTML='<option value="">すべて</option>'+users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('');$('reactionFilterPost').innerHTML='<option value="">すべて</option>'+posts.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}
function renderAnalysis(){let counts={};data.reactions.forEach(r=>{let p=data.posts.find(p=>p.id===r.postId);if(!p)return;let k=p.id;counts[k]??={p,total:0,types:{}};counts[k].total++;counts[k].types[r.type]=(counts[k].types[r.type]||0)+1});let arr=Object.values(counts).sort((a,b)=>b.total-a.total);$('analysisContent').innerHTML=arr.length?arr.map(x=>`<div class="usercard"><strong>${esc(x.p.title)}</strong><div class="cardmeta">${x.p.date} · 記録 ${x.total}件</div>${Object.entries(x.types).map(([k,v])=>`<span class="badge">${esc(k)}：${v}</span>`).join('')}</div>`).join():'<div class="empty">リアクション記録が蓄積されると、ここに集計が表示されます。</div>'}
function render(){renderUsers();renderPosts();fillSelects();refreshMemoLinkOptions();renderReactions();renderAnalysis()}
$('exportBtn').onclick=()=>download('nfm-backup.json',JSON.stringify(data,null,2),'application/json');
$('csvBtn').onclick=()=>{let rows=[['NFM_ID','Nana_ID','表示名','フォロー','フォロワー','要確認','お気に入り','ピン','メモ'],...data.users.map(u=>[u.nfmId,u.nanaId,u.name,u.following,u.follower,u.other,u.favorite,u.pinned,u.memo||''])];download('nfm-users.csv',rows.map(r=>r.map(csv).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,text,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff',text],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let text=await f.text();if(f.name.toLowerCase().endsWith('.json')){let d=JSON.parse(text);if(!d.users||!d.posts||!d.reactions)throw Error('NFM形式のJSONではありません');if(confirm('現在のデータを読み込んだ内容で置き換えますか？')){data=Object.assign(fresh(),d);save()}}else{alert('CSV取り込みはこの版ではユーザー一覧CSVの復元に未対応です。JSONバックアップをご利用ください。')}}catch(err){alert('読み込みに失敗しました：'+err.message)}e.target.value=''};
resetPostForm();render();
</script>
</body></html>
